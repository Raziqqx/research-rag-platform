# CI: lint + tests (Python, web) + Terraform checks. No secrets: the mock provider is used,
# tests seed a tiny in-code fixture corpus (tests/conftest.py) into a Testcontainers
# pgvector database with fake embedder/reranker, so no PDFs or model downloads are needed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1" # fail loudly if any test tries to download a model
      ANTHROPIC_API_KEY: "" # mock provider only
      RAG_REQUIRE_DOCKER: "1" # integration tests must run, not skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch keeps the install ~10x smaller than the CUDA build)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check rag scripts tests
          ruff format --check rag scripts tests
      - name: Pytest (unit + Testcontainers integration)
        run: pytest -q -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
